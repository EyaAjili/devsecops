# Règles custom déployées par terraform/falco.tf (Helm Falco).
# Les champs %evt.duration et %proc.duration dans output permettent
# à Falcosidekick de remplir output_fields pour le collector.
#
# Syntaxe Falco : condition = macros/champs kernel ; output = texte d'alerte.
#
# IMPORTANT : les output utilisent une seule ligne (pas de >) pour éviter
# l'erreur LOAD_ERR_COMPILE_OUTPUT avec les versions récentes de Falco.

# ------------------------------------------------------------
# RÉSEAU
# ------------------------------------------------------------

- rule: Suspicious outbound connection
  desc: Connexion sortante depuis un conteneur vers un port autre que 80, 443 ou 53
  condition: >
    outbound and container and
    fd.rport != 80 and
    fd.rport != 443 and
    fd.rport != 53
  output: "Suspicious outbound connection (user=%user.name uid=%user.uid command=%proc.cmdline connection=%fd.name container=%container.name image=%container.image.repository container_id=%container.id container_image_repository=%container.image.repository container_image_tag=%container.image.tag k8s_pod_name=%k8s.pod.name k8s_ns_name=%k8s.ns.name)"
  priority: WARNING
  tags: [network, custom]

- rule: Unexpected inbound connection on non-standard port
  desc: Connexion entrante TCP/UDP sur un port autre que 80, 443 ou 53
  condition: >
    evt.type=accept and
    container and
    fd.l4proto in (tcp, udp) and
    fd.lport != 80 and
    fd.lport != 443 and
    fd.lport != 53
  output: "Unexpected inbound connection on non-standard port (connection=%fd.name local_port=%fd.lport process=%proc.name container=%container.name image=%container.image.repository container_id=%container.id container_image_repository=%container.image.repository container_image_tag=%container.image.tag k8s_pod_name=%k8s.pod.name k8s_ns_name=%k8s.ns.name)"
  priority: WARNING
  tags: [network, custom]

# ------------------------------------------------------------
# FICHIERS SENSIBLES
# ------------------------------------------------------------

- rule: Sensitive file access outside shadow
  desc: Lecture de clés SSH ou fichiers PEM dans un conteneur
  condition: >
    open_read and container and
    (fd.name startswith /etc/ssh or
     fd.name startswith /root/.ssh or
     fd.name endswith .pem)
  output: "Sensitive credential file accessed (user=%user.name uid=%user.uid file=%fd.name process=%proc.name container=%container.name image=%container.image.repository container_id=%container.id container_image_tag=%container.image.tag k8s_pod_name=%k8s.pod.name k8s_ns_name=%k8s.ns.name)"
  priority: CRITICAL
  tags: [filesystem, credentials, custom]

- rule: Sensitive environment variable credential access
  desc: Lecture de /proc/*/environ (souvent des secrets)
  condition: >
    open_read and container and
    (fd.name=/proc/self/environ or
     fd.name glob /proc/*/environ)
  output: "Possible credential access through process environment (user=%user.name uid=%user.uid file=%fd.name process=%proc.name container=%container.name image=%container.image.repository container_id=%container.id container_image_tag=%container.image.tag k8s_pod_name=%k8s.pod.name k8s_ns_name=%k8s.ns.name)"
  priority: WARNING
  tags: [credentials, process, custom]

# ------------------------------------------------------------
# PROCESSUS
# ------------------------------------------------------------

- rule: Unexpected package manager execution
  desc: Installation de paquets dans un conteneur (souvent non prévu)
  condition: >
    spawned_process and container and
    proc.name in (apt, apt-get, yum, dnf, apk, pip, pip3)
  output: "Package manager executed in container (user=%user.name uid=%user.uid command=%proc.cmdline container=%container.name image=%container.image.repository container_id=%container.id container_image_tag=%container.image.tag k8s_pod_name=%k8s.pod.name k8s_ns_name=%k8s.ns.name)"
  priority: WARNING
  tags: [process, custom]

- rule: Unexpected process spawned in application container
  desc: Shell ou outil réseau (curl/wget/nc) lancé dans un conteneur applicatif
  condition: >
    spawned_process and container and
    proc.name in (bash, sh, zsh, nc, ncat, curl, wget)
  output: "Unexpected process spawned in application container (user=%user.name uid=%user.uid process=%proc.name command=%proc.cmdline parent=%proc.pname container=%container.name image=%container.image.repository container_id=%container.id container_image_tag=%container.image.tag k8s_pod_name=%k8s.pod.name k8s_ns_name=%k8s.ns.name)"
  priority: WARNING
  tags: [process, execution, custom]

# ------------------------------------------------------------
# BASELINE (namespace demo-app uniquement)
# ------------------------------------------------------------

- rule: Baseline normal activity demo-app
  desc: Tout processus lancé dans demo-app (pour alimenter le CSV / l'UBA)
  condition: >
    spawned_process and container and
    k8s.ns.name = "demo-app"
  output: "Baseline activity (user=%user.name uid=%user.uid process=%proc.name command=%proc.cmdline parent=%proc.pname container=%container.name image=%container.image.repository pod=%k8s.pod.name container_id=%container.id container_image_tag=%container.image.tag k8s_pod_name=%k8s.pod.name k8s_ns_name=%k8s.ns.name)"
  priority: INFORMATIONAL
  tags: [baseline, custom]
