apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: quarantine-policy
  namespace: demo-app
spec:
  description: "Strict network quarantine for AI-detected compromised pods"

  endpointSelector:
    matchLabels:
      quarantine: "true"

  # No inbound connections to quarantined pods.
  ingress: []

  # Default-deny egress with DNS-only exception.
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
